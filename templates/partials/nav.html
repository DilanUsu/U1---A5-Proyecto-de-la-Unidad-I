<nav class="navbar">
    <a class="brand" href="{{ url_for('users.index') }}">Usuarios App</a>
    <ul class="nav-links">
        {% if session.user_id %}
            <li><a href="{{ url_for('users.profile', id=session.user_id) }}">Mi perfil</a></li>
            <li><a href="{{ url_for('users.logout') }}">Cerrar sesión</a></li>
        {% else %}
            <li><a href="{{ url_for('users.login') }}">Iniciar sesión</a></li>
            <li><a href="{{ url_for('users.register') }}">Registrarme</a></li>
        {% endif %}
    </ul>
</nav>
