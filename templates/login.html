{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<h1>Iniciar sesión</h1>
<form method="POST" novalidate>
    {{ form.hidden_tag() }}
    {% for campo in [form.email, form.password] %}
        {% include "partials/_campo.html" %}
    {% endfor %}
    {{ form.submit() }}
</form>
{% endblock %}
