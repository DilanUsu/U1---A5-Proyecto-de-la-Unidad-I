{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<h1>Registro</h1>
<form method="POST" novalidate>
    {{ form.hidden_tag() }}
    {% for campo in [form.username, form.email, form.password, form.confirm_password] %}
        {% include "partials/_campo.html" %}
    {% endfor %}
    {{ form.submit() }}
</form>
{% endblock %}
