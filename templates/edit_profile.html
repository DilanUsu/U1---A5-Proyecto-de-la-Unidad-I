{% extends "base.html" %}

{% block title %}Editar perfil{% endblock %}

{% block content %}
<h1>Editar perfil</h1>
<form method="POST" novalidate>
    {{ form.hidden_tag() }}
    {% for campo in [form.username, form.email] %}
        {% include "partials/_campo.html" %}
    {% endfor %}
    {{ form.submit() }}
</form>
{% endblock %}
