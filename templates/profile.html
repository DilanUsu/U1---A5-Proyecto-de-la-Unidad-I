{% extends "base.html" %}

{% block title %}{{ usuario.username|capitalize }}{% endblock %}

{% block content %}
<h1>{{ usuario.username|capitalize }}</h1>
<p>Correo: {{ usuario.email|default("Sin correo") }}</p>

{% if session.user_id == usuario.id %}
    <a href="{{ url_for('users.edit_profile', id=usuario.id) }}">Editar perfil</a>
    <form method="POST" action="{{ url_for('users.delete_profile', id=usuario.id) }}" data-confirm="¿Eliminar tu cuenta?">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Eliminar cuenta</button>
    </form>
{% endif %}
{% endblock %}
